name: hermes
label: Hermes Agent
description: Nous Hermes Agent with tools, profiles, memory, and messaging support
homepage: https://github.com/NousResearch/hermes-agent
tags: [coding, tools, orchestration, profiles]
builtin: true

install:
  binary: hermes
  requires: [python3]
  # Hermes has no native Windows distribution. The user installs it inside
  # WSL2 themselves (see hermes-agent README); the launcher detects it via
  # `wsl -e which hermes` and bridges all subprocess calls through wsl.exe.
  # `windows_strategy: wsl` opts the installer / health check into the WSL
  # fallback path implemented in installer.js + adapters/hermes.js.
  windows_strategy: wsl
  macos: "curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash"
  linux: "curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash"
  windows: "wsl -e which hermes"

adapter:
  module: openagents.adapters.hermes
  class: HermesAdapter
  options:
    hermes_profile: auto
    hermes_source: tool
    max_turns: 60
    yolo: false
